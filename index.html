<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ANGVEY</title>
<style>html,body{margin:0;background:#0D0D0F;color:#A1A1AA;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}</style>
</head><body><div class="boot" id="boot">Loading ANGVEY…</div>
<script>
(async()=>{
  try {
    const paths = ['/p00.txt','/p01.txt','/p02.txt','/p03.txt','/p04.txt','/p05.txt','/p06.txt','/p07.txt','/p08.txt','/p09.txt','/p10.txt'];
    const texts = await Promise.all(paths.map(p => fetch(p,{cache:'no-store'}).then(r => { if(!r.ok) throw new Error(p+' '+r.status); return r.text(); }));
    document.open(); document.write(texts.join('')); document.close();
  } catch(e) {
    const el=document.getElementById('boot');
    if(el) el.innerHTML = '<p style="color:#f87171">Failed: '+e.message+'</p>';
  }
})();
</script></body></html>
